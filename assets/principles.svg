<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Ten principles, and the check in each Cairn plugin that enforces it">
<rect x="1" y="1" width="1278" height="798" rx="28" fill="#F6F9FF" stroke="#DCE5F5" stroke-width="2"/>
<text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0A6CFF">ONE SET OF PRINCIPLES, THREE PLUGINS THAT ENFORCE THEM</text>
<rect x="480" y="92" width="246" height="5" rx="2.5" fill="#0A6CFF"/><text x="480" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Cairn Memory</text><rect x="742" y="92" width="246" height="5" rx="2.5" fill="#6CCBFF"/><text x="742" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Cairn Signals</text><rect x="1004" y="92" width="246" height="5" rx="2.5" fill="#D97706"/><text x="1004" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Cairn Verify</text><rect x="28" y="146" width="1226" height="56" rx="12" fill="#FFFFFF"/><text x="40" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0A6CFF">1</text><text x="74" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Enforce, or don't assert</text><circle cx="488" cy="169" r="6" fill="#0A6CFF"/><text x="502" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">walk test: every pointer resolves</text><circle cx="750" cy="169" r="6" fill="#6CCBFF"/><text x="764" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">published numbers must re-run</text><circle cx="1012" cy="169" r="6" fill="#D97706"/><text x="1026" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">proof words need proof</text><text x="40" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0A6CFF">2</text><text x="74" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">A test that never imports its subject</text><text x="74" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">can't fail for the right reason</text><text x="482" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#DCE5F5">—</text><circle cx="750" cy="231" r="6" fill="#6CCBFF"/><text x="764" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">evals that can't fail</text><circle cx="1012" cy="231" r="6" fill="#D97706"/><text x="1026" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">tests that miss the change</text><rect x="28" y="270" width="1226" height="56" rx="12" fill="#FFFFFF"/><text x="40" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0A6CFF">3</text><text x="74" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Readers need writers</text><circle cx="488" cy="293" r="6" fill="#0A6CFF"/><text x="502" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">a memory no index reads</text><circle cx="750" cy="293" r="6" fill="#6CCBFF"/><text x="764" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">a score input nothing writes</text><circle cx="1012" cy="293" r="6" fill="#D97706"/><text x="1026" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">wired, and nothing calls it</text><text x="40" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0A6CFF">4</text><text x="74" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Swallow, don't silence</text><text x="482" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#DCE5F5">—</text><circle cx="750" cy="355" r="6" fill="#6CCBFF"/><text x="764" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">failures that become a believable 0</text><text x="1006" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#DCE5F5">—</text><rect x="28" y="394" width="1226" height="56" rx="12" fill="#FFFFFF"/><text x="40" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0A6CFF">5</text><text x="74" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">One derivation, two callers</text><circle cx="488" cy="417" r="6" fill="#0A6CFF"/><text x="502" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">generated views check invariants</text><text x="744" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#DCE5F5">—</text><text x="1006" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#DCE5F5">—</text><text x="40" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0A6CFF">6</text><text x="74" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Check the instrument, not only the code</text><circle cx="488" cy="479" r="6" fill="#0A6CFF"/><text x="502" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">--self-test: 22 checks</text><circle cx="750" cy="479" r="6" fill="#6CCBFF"/><text x="764" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">--self-test: 11 checks</text><circle cx="1012" cy="479" r="6" fill="#D97706"/><text x="1026" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">--self-test: 19 checks</text><rect x="28" y="518" width="1226" height="56" rx="12" fill="#FFFFFF"/><text x="40" y="546" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0A6CFF">7</text><text x="74" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Name what would dissolve the explanation</text><circle cx="488" cy="541" r="6" fill="#0A6CFF"/><text x="502" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">memory is a claim about the past</text><circle cx="750" cy="541" r="6" fill="#6CCBFF"/><text x="764" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">name what disproves the verdict</text><circle cx="1012" cy="541" r="6" fill="#D97706"/><text x="1026" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">name what disproves the verdict</text><text x="40" y="608" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0A6CFF">8</text><text x="74" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Don't cry wolf</text><circle cx="488" cy="603" r="6" fill="#0A6CFF"/><text x="502" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">FAIL only for breaches</text><circle cx="750" cy="603" r="6" fill="#6CCBFF"/><text x="764" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">HIGH / MEDIUM / INFO levels</text><circle cx="1012" cy="603" r="6" fill="#D97706"/><text x="1026" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">guards built from honest commits</text><rect x="28" y="642" width="1226" height="56" rx="12" fill="#FFFFFF"/><text x="40" y="670" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0A6CFF">9</text><text x="74" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Check what a metric is defined over</text><text x="482" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#DCE5F5">—</text><circle cx="750" cy="665" r="6" fill="#6CCBFF"/><text x="764" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">can it see the main failure?</text><text x="1006" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#DCE5F5">—</text><text x="40" y="732" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0A6CFF">10</text><text x="74" y="732" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Name the narrowest verifying command</text><circle cx="488" cy="727" r="6" fill="#0A6CFF"/><text x="502" y="732" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">status memories carry a re-check</text><circle cx="750" cy="727" r="6" fill="#6CCBFF"/><text x="764" y="732" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">the query that settles it</text><circle cx="1012" cy="727" r="6" fill="#D97706"/><text x="1026" y="732" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">the command that settles it</text>
</svg>
